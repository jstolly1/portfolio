<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Jack Stolly</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <style>
      html, body {
        margin: 0;
        padding: 0;
        height: 100%;
        background: #ffffff;
        overflow: hidden;
        font-family: Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif;
        color: #000;
      }
      #stage {
        display: block;
        width: 100%;
        height: 100%;
        touch-action: none;
        cursor: default;
      }
      #stage.grabbable { cursor: grab; }
      #stage.grabbing { cursor: grabbing; }

      .mobile { display: none; }
      @media (max-width: 767px) {
        #stage { display: none; }
        .mobile {
          display: flex;
          align-items: center;
          justify-content: center;
          height: 100%;
          font-weight: 500;
          font-size: 28px;
          letter-spacing: -0.01em;
        }
      }

      /* Bottom-center nav: three circles half-buried under the viewport edge.
         Hover lifts one fully into view with a springy overshoot, fades the
         label in, and emits two staggered sonar-pulse rings. */
      .menu {
        position: fixed;
        bottom: 0;
        left: 50%;
        transform: translateX(-50%);
        display: flex;
        gap: 32px;
        padding: 0 24px;
        pointer-events: none; /* gaps pass clicks through to the canvas */
        z-index: 10;
      }
      .menu-item {
        width: 88px;
        height: 88px;
        border-radius: 50%;
        border: 2px solid #000;
        background: #fff;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        pointer-events: auto;
        transform: translateY(50%);
        transition: transform 380ms cubic-bezier(0.34, 1.56, 0.64, 1);
        position: relative;
        font-weight: 500;
        font-size: 15px;
        letter-spacing: -0.01em;
        color: #000;
        text-decoration: none;
        user-select: none;
      }
      .menu-item span {
        opacity: 0;
        transform: translateY(6px);
        transition: opacity 220ms ease 80ms, transform 220ms ease 80ms;
      }
      .menu-item:hover { transform: translateY(0); }
      .menu-item:hover span { opacity: 1; transform: translateY(0); }
      .menu-item::before,
      .menu-item::after {
        content: '';
        position: absolute;
        inset: -2px;
        border-radius: 50%;
        border: 2px solid #000;
        opacity: 0;
        pointer-events: none;
      }
      .menu-item:hover::before { animation: menu-pulse 1.4s ease-out infinite; }
      .menu-item:hover::after  { animation: menu-pulse 1.4s ease-out 0.7s infinite; }
      @keyframes menu-pulse {
        0%   { transform: scale(1);   opacity: 0.55; }
        100% { transform: scale(1.7); opacity: 0;    }
      }
      @media (max-width: 767px) { .menu { display: none; } }
    </style>
  </head>
  <body>
    <canvas id="stage"></canvas>
    <div class="mobile">Jack Stolly</div>
    <nav class="menu" aria-label="Primary">
      <a class="menu-item" href="#about"><span>About</span></a>
      <a class="menu-item" href="#work"><span>Work</span></a>
      <a class="menu-item" href="#contact"><span>Contact</span></a>
    </nav>

    <script type="importmap">
      {
        "imports": {
          "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
          "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
      }
    </script>

    <script type="module">
      import * as THREE from 'three';
      import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
      import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
      import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';

      const NAME = 'Jack Stolly';
      const COMING_SOON = 'Coming Soon';
      const MIN_DESKTOP_WIDTH = 768;
      const BALL_PIXEL_RADIUS = 220;

      const canvas = document.getElementById('stage');
      const renderer = new THREE.WebGLRenderer({ canvas, antialias: true, alpha: false });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setClearColor(0xffffff, 1);
      renderer.outputColorSpace = THREE.SRGBColorSpace;
      // Tone mapping rolls bright highlights off smoothly instead of clipping
      // to pure white — keeps top tiles visible against the white page bg.
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.05;

      const scene = new THREE.Scene();

      const camera = new THREE.OrthographicCamera(-1, 1, 1, -1, 0.1, 100);
      camera.position.set(0, 0, 10);
      camera.lookAt(0, 0, 0);

      // --- Environment map for the disco ball facets ---
      // Bright "studio" environment — most tiles should look like silvery
      // mirrors, with soft pastel zones giving the occasional colored tile and
      // a few sharp white hotspots for sparkle.
      function makeEnvMap() {
        const c = document.createElement('canvas');
        c.width = 1024;
        c.height = 512;
        const ctx = c.getContext('2d');

        // Brighter silvery base for punchier mirror tiles. The dark page bg
        // during disco lets us run a brighter env without blowing out.
        const grad = ctx.createLinearGradient(0, 0, 0, c.height);
        grad.addColorStop(0.0, '#b8bcc6');
        grad.addColorStop(0.3, '#dde0e6');
        grad.addColorStop(0.55, '#c0c4cc');
        grad.addColorStop(0.8, '#8c9098');
        grad.addColorStop(1.0, '#5e6268');
        ctx.fillStyle = grad;
        ctx.fillRect(0, 0, c.width, c.height);

        // Large soft pastel washes — these are what make some tiles read as
        // pink/blue/purple/green instead of pure silver.
        const washes = [
          { x: 0.12, y: 0.32, r: 280, color: 'rgba(255, 180, 200, 0.55)' },
          { x: 0.40, y: 0.20, r: 320, color: 'rgba(180, 220, 255, 0.55)' },
          { x: 0.70, y: 0.40, r: 300, color: 'rgba(220, 200, 255, 0.55)' },
          { x: 0.92, y: 0.25, r: 260, color: 'rgba(255, 230, 180, 0.50)' },
          { x: 0.30, y: 0.70, r: 280, color: 'rgba(190, 255, 220, 0.40)' },
          { x: 0.80, y: 0.72, r: 260, color: 'rgba(255, 210, 230, 0.40)' },
        ];
        for (const t of washes) {
          const cx = t.x * c.width;
          const cy = t.y * c.height;
          const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, t.r);
          rg.addColorStop(0, t.color);
          rg.addColorStop(1, t.color.replace(/[\d.]+\)$/, '0)'));
          ctx.fillStyle = rg;
          ctx.fillRect(cx - t.r, cy - t.r, t.r * 2, t.r * 2);
        }

        // Tight bright hotspots — these become the brilliant white tiles.
        const hots = [
          { x: 0.22, y: 0.18, r: 70 },
          { x: 0.55, y: 0.10, r: 90 },
          { x: 0.82, y: 0.22, r: 65 },
          { x: 0.45, y: 0.55, r: 55 },
          { x: 0.10, y: 0.50, r: 50 },
          { x: 0.65, y: 0.62, r: 55 },
        ];
        for (const h of hots) {
          const cx = h.x * c.width;
          const cy = h.y * c.height;
          const rg = ctx.createRadialGradient(cx, cy, 0, cx, cy, h.r);
          rg.addColorStop(0, 'rgba(255,255,255,1)');
          rg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = rg;
          ctx.fillRect(cx - h.r, cy - h.r, h.r * 2, h.r * 2);
        }

        // Lots of pinpoint sparkles. With a sharp metallic material these create
        // the constantly-moving tile shimmer as the ball spins — each pinpoint
        // catches a tile briefly, then passes to the next. With bloom on, each
        // pinpoint reflection becomes a glowing star.
        for (let i = 0; i < 380; i++) {
          const x = Math.random() * c.width;
          const y = Math.random() * c.height * 0.92;
          const r = 2 + Math.random() * 11;
          const rg = ctx.createRadialGradient(x, y, 0, x, y, r);
          rg.addColorStop(0, 'rgba(255,255,255,1)');
          rg.addColorStop(0.3, 'rgba(255,255,255,0.9)');
          rg.addColorStop(1, 'rgba(255,255,255,0)');
          ctx.fillStyle = rg;
          ctx.fillRect(x - r, y - r, r * 2, r * 2);
        }

        const tex = new THREE.CanvasTexture(c);
        tex.mapping = THREE.EquirectangularReflectionMapping;
        tex.colorSpace = THREE.SRGBColorSpace;

        const pmrem = new THREE.PMREMGenerator(renderer);
        const envMap = pmrem.fromEquirectangular(tex).texture;
        tex.dispose();
        pmrem.dispose();
        return envMap;
      }
      const envMap = makeEnvMap();

      // --- Faceted disco-ball geometry ---
      // Lat/long grid of flat quads, brick-offset row to row so it doesn't read
      // as a rigid mesh. Each tile shares one outward normal across all four
      // verts, so MeshStandardMaterial reflects the env map as a single flat
      // mirror per tile — the real disco-ball look.
      function buildDiscoGeometry(radius, rows, cols) {
        const positions = [];
        const normals = [];
        const colors = [];
        const indices = [];

        const tileColor = new THREE.Color();

        for (let i = 0; i < rows; i++) {
          const lat0 = (i / rows) * Math.PI - Math.PI / 2;
          const lat1 = ((i + 1) / rows) * Math.PI - Math.PI / 2;
          const cosFactor = Math.cos((lat0 + lat1) / 2);
          // Brick offset: alternate rows shift by half a tile width.
          const lonShift = (i % 2) * (Math.PI / cols);
          // Fewer tiles near the poles so they don't pinch to slivers.
          const effectiveCols = Math.max(4, Math.round(cols * Math.max(0.25, cosFactor)));

          for (let j = 0; j < effectiveCols; j++) {
            const lon0 = (j / effectiveCols) * Math.PI * 2 + lonShift;
            const lon1 = ((j + 1) / effectiveCols) * Math.PI * 2 + lonShift;

            // Small inset so tiles read as discrete mirrors with thin gaps.
            const inset = 0.04;
            const dlat = (lat1 - lat0) * inset;
            const dlon = (lon1 - lon0) * inset;
            const la0 = lat0 + dlat, la1 = lat1 - dlat;
            const lo0 = lon0 + dlon, lo1 = lon1 - dlon;

            const c00 = sphToCart(la0, lo0, radius);
            const c01 = sphToCart(la0, lo1, radius);
            const c11 = sphToCart(la1, lo1, radius);
            const c10 = sphToCart(la1, lo0, radius);

            // Single normal for the whole tile = direction from origin to tile
            // center. This is what makes each tile reflect as one flat mirror.
            const center = sphToCart((la0 + la1) / 2, (lo0 + lo1) / 2, 1);

            // Subtle per-tile color tint — mostly near-white, occasionally pastel.
            if (Math.random() < 0.78) {
              const v = 0.93 + Math.random() * 0.07;
              tileColor.setRGB(v, v, v);
            } else {
              tileColor.setHSL(Math.random(), 0.18 + Math.random() * 0.2, 0.84 + Math.random() * 0.08);
            }

            const baseIdx = positions.length / 3;
            for (const c of [c00, c01, c11, c10]) {
              positions.push(c[0], c[1], c[2]);
              normals.push(center[0], center[1], center[2]);
              colors.push(tileColor.r, tileColor.g, tileColor.b);
            }
            indices.push(baseIdx, baseIdx + 1, baseIdx + 2);
            indices.push(baseIdx, baseIdx + 2, baseIdx + 3);
          }
        }

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.Float32BufferAttribute(positions, 3));
        geo.setAttribute('normal', new THREE.Float32BufferAttribute(normals, 3));
        geo.setAttribute('color', new THREE.Float32BufferAttribute(colors, 3));
        geo.setIndex(indices);
        return geo;
      }

      function sphToCart(lat, lon, r) {
        const cl = Math.cos(lat);
        return [r * cl * Math.cos(lon), r * Math.sin(lat), r * cl * Math.sin(lon)];
      }

      // --- Base ball texture: white + black "Jack Stolly" ---
      function makeBaseTexture() {
        const c = document.createElement('canvas');
        c.width = 2048;
        c.height = 1024;
        const ctx = c.getContext('2d');
        ctx.fillStyle = '#ffffff';
        ctx.fillRect(0, 0, c.width, c.height);
        ctx.fillStyle = '#000000';
        ctx.textAlign = 'center';
        ctx.textBaseline = 'middle';

        // Name at longitude ~90° (x = 0.25), "Coming Soon" 180° around (x = 0.75).
        ctx.font = '500 70px Inter, -apple-system, BlinkMacSystemFont, "Helvetica Neue", Arial, sans-serif';
        // Tighter kerning. Canvas2D letterSpacing is supported in modern browsers.
        ctx.letterSpacing = '-3px';
        ctx.fillText(NAME, c.width * 0.25, c.height * 0.5);
        ctx.fillText(COMING_SOON, c.width * 0.75, c.height * 0.5);
        ctx.letterSpacing = '0px';

        const tex = new THREE.CanvasTexture(c);
        tex.anisotropy = 8;
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      // --- Geometry + materials ---
      const RADIUS = 1;
      const OUTLINE_SCALE = 1.015;
      const EFFECTIVE_RADIUS = RADIUS * OUTLINE_SCALE;

      const sphereGeo = new THREE.SphereGeometry(RADIUS, 96, 64);
      // Tile grid: 14 rows × 28 cols at the equator (≈ square tiles), with
      // brick-offset alternating rows and column count tapering toward poles.
      const discoGeo = buildDiscoGeometry(RADIUS, 14, 28);

      // Normal mode: flat white with black text, no shading.
      // toneMapped:false so ACES doesn't push pure white into grey territory.
      // transparent stays true permanently — only opacity changes — so we never
      // flip render paths between transparent/opaque mid-fade (that flip was
      // causing a visible one-frame hiccup at the end of the disco fade).
      const matNormal = new THREE.MeshBasicMaterial({
        map: makeBaseTexture(),
        color: 0xffffff,
        transparent: true,
        opacity: 1,
        toneMapped: false,
      });

      const outlineMat = new THREE.MeshBasicMaterial({
        color: 0x000000,
        side: THREE.BackSide,
        transparent: true,
        opacity: 1,
        toneMapped: false,
      });

      // Disco ball: faceted chrome reflecting the env map. Per-tile vertex
      // colors give the silvery / pastel variation visible across the surface.
      // MeshPhysicalMaterial unlocks iridescence — thin-film interference that
      // shifts the hue of each tile's reflection slightly based on the angle.
      // On a faceted ball, this gives subtle rainbow color shimmer across the
      // surface as it spins, on top of the metallic sparkle.
      const matDisco = new THREE.MeshPhysicalMaterial({
        color: 0xffffff,
        vertexColors: true,
        metalness: 1.0,
        roughness: 0.06,
        envMap,
        envMapIntensity: 1.1,
        iridescence: 0.45,
        iridescenceIOR: 1.5,
        iridescenceThicknessRange: [120, 1200],
        transparent: true,
        opacity: 1,
        side: THREE.DoubleSide,
      });

      const ballGroup = new THREE.Group();
      scene.add(ballGroup);

      const ball = new THREE.Mesh(sphereGeo, matNormal);
      ballGroup.add(ball);

      const outline = new THREE.Mesh(sphereGeo, outlineMat);
      outline.scale.setScalar(OUTLINE_SCALE);
      ballGroup.add(outline);

      // Solid dark core sphere — sits just inside the tile shell so the gaps
      // between tiles reveal a dark interior (like real disco-ball foam/glue)
      // instead of letting the room background bleed through.
      const matDiscoCore = new THREE.MeshBasicMaterial({
        color: 0x0a0a12,
        toneMapped: false,
        transparent: true,
        opacity: 1,
      });
      const discoCore = new THREE.Mesh(
        new THREE.SphereGeometry(RADIUS * 0.985, 64, 48),
        matDiscoCore,
      );
      discoCore.visible = false;
      discoCore.renderOrder = 0;
      ballGroup.add(discoCore);

      const discoBall = new THREE.Mesh(discoGeo, matDisco);
      discoBall.visible = false;
      discoBall.renderOrder = 1;
      ballGroup.add(discoBall);

      // (Disco PointLights removed — they were creating bright illuminated
      // spots on the disco ball that bloom amplified into lingering halos at
      // each light's world position, even as the ball faded. Env map gives
      // plenty of sparkle by itself.)

      // --- Background spotlights ---
      // Translucent colored radial blobs that drift across the page during disco.
      // Additive blending against the dark bg gives them a "sweeping spotlight"
      // look without needing volumetric rendering.
      function makeSpotTexture(rgb) {
        const c = document.createElement('canvas');
        c.width = 256;
        c.height = 256;
        const ctx = c.getContext('2d');
        const rg = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
        rg.addColorStop(0.0, `rgba(${rgb}, 1)`);
        rg.addColorStop(0.4, `rgba(${rgb}, 0.45)`);
        rg.addColorStop(1.0, `rgba(${rgb}, 0)`);
        ctx.fillStyle = rg;
        ctx.fillRect(0, 0, 256, 256);
        const tex = new THREE.CanvasTexture(c);
        tex.colorSpace = THREE.SRGBColorSpace;
        return tex;
      }

      const spotlightColors = [
        '255, 80, 160',
        '80, 200, 255',
        '255, 220, 100',
        '200, 110, 255',
      ];
      const spotlights = spotlightColors.map((rgb, i) => {
        const mat = new THREE.MeshBasicMaterial({
          map: makeSpotTexture(rgb),
          transparent: true,
          blending: THREE.AdditiveBlending,
          depthWrite: false,
          opacity: 0,
          toneMapped: false,
        });
        // Smaller planes so a single spotlight can't engulf half the screen
        // when its orbit puts the center near a corner.
        const mesh = new THREE.Mesh(new THREE.PlaneGeometry(5, 5), mat);
        mesh.position.z = -3; // behind the ball
        mesh.visible = false;
        mesh.userData = {
          phase: (i / spotlightColors.length) * Math.PI * 2,
          speedX: 0.00022 + Math.random() * 0.00018,
          speedY: 0.00016 + Math.random() * 0.00012,
        };
        scene.add(mesh);
        return mesh;
      });

      // --- Bloom postprocessing ---
      // Bright sparkle pixels on the disco ball pick up a glow halo, which is
      // what sells the "WOW" shimmer factor. Enabled only during the disco
      // effect — normal mode renders straight through the renderer.
      const composer = new EffectComposer(renderer);
      composer.addPass(new RenderPass(scene, camera));
      const bloomPass = new UnrealBloomPass(
        new THREE.Vector2(window.innerWidth, window.innerHeight),
        0.0, // strength — animated per-frame from disco intensity
        0.35, // radius — tight halo, not a wash
        0.92, // threshold — only the brightest sparkle pixels bloom
      );
      composer.addPass(bloomPass);

      // Re-render the base texture once Inter actually loads.
      if (document.fonts && document.fonts.load) {
        document.fonts.load('500 70px Inter').then(() => {
          matNormal.map.dispose();
          matNormal.map = makeBaseTexture();
          matNormal.needsUpdate = true;
        });
      }

      // --- Motion + interaction state ---
      const SPEED = 1.6;
      const ROT_SPEED = 0.55;
      const RESUME_DURATION = 2;
      const HOLD_BEFORE_SHAKE = 1.0;

      // Disco effect timings — 5s total with a snappy quarter-second fade.
      const DISCO_DURATION_MS = 4750; // full disco (4.75s)
      const DISCO_FADE_MS = 250;      // fade back to normal (0.25s)
      const DISCO_TOTAL_MS = DISCO_DURATION_MS + DISCO_FADE_MS;

      const state = {
        pos: new THREE.Vector2(0, 0),
        vel: new THREE.Vector2(0, 0),
        rotAxis: new THREE.Vector3(-0.2, -1, -0.1).normalize(),
        dragging: false,
        dragStart: 0,
        releaseTime: -Infinity,
        releaseSpeed: SPEED,
        discoStart: -Infinity,
      };

      const lastPointer = new THREE.Vector2(NaN, NaN);
      let viewWidth = 10, viewHeight = 10;
      let active = true;

      // Background color lerps from white → deep midnight purple during disco.
      const bgNormal = new THREE.Color(0xffffff);
      const bgDisco = new THREE.Color(0x140a26);
      const bgCurrent = new THREE.Color(0xffffff);

      function resize() {
        const w = window.innerWidth;
        const h = window.innerHeight;
        active = w >= MIN_DESKTOP_WIDTH;
        if (!active) return;

        renderer.setSize(w, h, false);
        composer.setSize(w, h);
        bloomPass.setSize(w, h);

        viewWidth = w / BALL_PIXEL_RADIUS;
        viewHeight = h / BALL_PIXEL_RADIUS;
        camera.left = -viewWidth / 2;
        camera.right = viewWidth / 2;
        camera.top = viewHeight / 2;
        camera.bottom = -viewHeight / 2;
        camera.updateProjectionMatrix();

        const maxX = viewWidth / 2 - EFFECTIVE_RADIUS;
        const maxY = viewHeight / 2 - EFFECTIVE_RADIUS;
        state.pos.x = THREE.MathUtils.clamp(state.pos.x, -maxX, maxX);
        state.pos.y = THREE.MathUtils.clamp(state.pos.y, -maxY, maxY);
      }
      window.addEventListener('resize', resize);
      resize();

      {
        // Launch on one of the four 45° diagonals so the ball heads straight
        // for a corner — maximizes the chance of triggering the disco easter egg.
        const angle = (Math.floor(Math.random() * 4) * 0.5 + 0.25) * Math.PI;
        state.vel.set(Math.cos(angle) * SPEED, Math.sin(angle) * SPEED);
      }

      // --- Pointer interaction ---
      const pointerWorld = new THREE.Vector2();
      const grabOffset = new THREE.Vector2();
      const samples = [];
      const SAMPLE_WINDOW_MS = 90;

      function screenToWorld(clientX, clientY, out) {
        const rect = canvas.getBoundingClientRect();
        const nx = ((clientX - rect.left) / rect.width) * 2 - 1;
        const ny = -(((clientY - rect.top) / rect.height) * 2 - 1);
        out.x = nx * camera.right;
        out.y = ny * camera.top;
        return out;
      }

      function pushSample(t, x, y) {
        samples.push({ t, x, y });
        const cutoff = t - SAMPLE_WINDOW_MS * 2;
        while (samples.length > 2 && samples[0].t < cutoff) samples.shift();
      }

      function throwVelocity(now) {
        const cutoff = now - SAMPLE_WINDOW_MS;
        let base = samples[0];
        for (const s of samples) { if (s.t >= cutoff) { base = s; break; } }
        const last = samples[samples.length - 1];
        if (!base || !last || last === base) return new THREE.Vector2(0, 0);
        const dt = (last.t - base.t) / 1000;
        if (dt <= 0) return new THREE.Vector2(0, 0);
        return new THREE.Vector2((last.x - base.x) / dt, (last.y - base.y) / dt);
      }

      function onPointerDown(e) {
        if (!active) return;
        if (e.button !== undefined && e.button !== 0) return;
        screenToWorld(e.clientX, e.clientY, pointerWorld);
        lastPointer.copy(pointerWorld);
        const dx = pointerWorld.x - state.pos.x;
        const dy = pointerWorld.y - state.pos.y;
        if (dx * dx + dy * dy > EFFECTIVE_RADIUS * EFFECTIVE_RADIUS) return;

        // Click during full disco → skip straight to the fade. Shifting
        // discoStart back so elapsed time = DISCO_DURATION_MS makes the next
        // discoIntensity() call land at the start of the fade window.
        const nowT = performance.now();
        const sinceDisco = nowT - state.discoStart;
        if (sinceDisco >= 0 && sinceDisco < DISCO_DURATION_MS) {
          state.discoStart = nowT - DISCO_DURATION_MS;
        }

        state.dragging = true;
        state.dragStart = performance.now();
        state.vel.set(0, 0);
        grabOffset.set(dx, dy);
        samples.length = 0;
        pushSample(performance.now(), state.pos.x, state.pos.y);
        canvas.classList.add('grabbing');
        canvas.setPointerCapture?.(e.pointerId);
        e.preventDefault();
      }

      function onPointerMove(e) {
        if (!active) return;
        screenToWorld(e.clientX, e.clientY, lastPointer);
        if (state.dragging) {
          const maxX = viewWidth / 2 - EFFECTIVE_RADIUS;
          const maxY = viewHeight / 2 - EFFECTIVE_RADIUS;
          state.pos.x = THREE.MathUtils.clamp(lastPointer.x - grabOffset.x, -maxX, maxX);
          state.pos.y = THREE.MathUtils.clamp(lastPointer.y - grabOffset.y, -maxY, maxY);
          pushSample(performance.now(), state.pos.x, state.pos.y);
        }
      }

      function onPointerUp(e) {
        if (!state.dragging) return;
        state.dragging = false;
        canvas.classList.remove('grabbing');
        canvas.releasePointerCapture?.(e.pointerId);

        const v = throwVelocity(performance.now());
        const MAX_THROW = 18;
        if (v.length() > MAX_THROW) v.setLength(MAX_THROW);
        if (v.length() < 0.25) {
          const angle = (Math.random() * 0.5 + 0.25) * Math.PI;
          const sign = Math.random() < 0.5 ? -1 : 1;
          v.set(Math.cos(angle) * SPEED * sign, Math.sin(angle) * SPEED);
        }
        state.vel.copy(v);
        state.releaseTime = performance.now();
        state.releaseSpeed = v.length();
      }

      function onPointerLeave() {
        lastPointer.set(NaN, NaN);
        canvas.classList.remove('grabbable');
      }

      canvas.addEventListener('pointerdown', onPointerDown);
      canvas.addEventListener('pointermove', onPointerMove);
      canvas.addEventListener('pointerup', onPointerUp);
      canvas.addEventListener('pointercancel', onPointerUp);
      canvas.addEventListener('pointerleave', onPointerLeave);

      // --- Disco state helper ---
      // Returns 0 (no disco), 1 (full disco), or a value in (0,1] during fade.
      // Specifically: 1 means full disco visible, fading to 0 means normal visible.
      function discoIntensity(now) {
        const t = now - state.discoStart;
        if (t < 0 || t > DISCO_TOTAL_MS) return 0;
        if (t < DISCO_DURATION_MS) return 1;
        const fadeT = (t - DISCO_DURATION_MS) / DISCO_FADE_MS;
        return 1 - fadeT;
      }

      // --- Animation loop ---
      let last = performance.now();
      function tick(now) {
        const dt = Math.min((now - last) / 1000, 1 / 30);
        last = now;

        if (!active) {
          requestAnimationFrame(tick);
          return;
        }

        const maxX = viewWidth / 2 - EFFECTIVE_RADIUS;
        const maxY = viewHeight / 2 - EFFECTIVE_RADIUS;

        // Disco intensity (1 = full disco, fading to 0 during fade window).
        // Computed early so we can slow time/spin based on it.
        const d = discoIntensity(now);
        // Slow-mo: at full disco, ball moves at 35% of its normal speed.
        const timeScale = 1 - d * 0.65;

        if (!state.dragging) {
          state.pos.addScaledVector(state.vel, dt * timeScale);

          let bouncedX = false, bouncedY = false;
          if (state.pos.x > maxX) { state.pos.x = maxX; state.vel.x = -Math.abs(state.vel.x); bouncedX = true; }
          if (state.pos.x < -maxX) { state.pos.x = -maxX; state.vel.x = Math.abs(state.vel.x); bouncedX = true; }
          if (state.pos.y > maxY) { state.pos.y = maxY; state.vel.y = -Math.abs(state.vel.y); bouncedY = true; }
          if (state.pos.y < -maxY) { state.pos.y = -maxY; state.vel.y = Math.abs(state.vel.y); bouncedY = true; }
          // Corner hit (both walls in the same frame) → start disco.
          if (bouncedX && bouncedY) {
            state.discoStart = now;
          }

          const sinceRelease = (now - state.releaseTime) / 1000;
          if (sinceRelease >= 0 && sinceRelease <= RESUME_DURATION && state.vel.lengthSq() > 1e-6) {
            const t = sinceRelease / RESUME_DURATION;
            const eased = 1 - Math.pow(1 - t, 3);
            const targetSpeed = THREE.MathUtils.lerp(state.releaseSpeed, SPEED, eased);
            state.vel.setLength(targetSpeed);
          }
        }

        // Wobble when held too long
        let shakeX = 0, shakeY = 0, wobbleRot = 0;
        if (state.dragging) {
          const held = (now - state.dragStart) / 1000;
          if (held > HOLD_BEFORE_SHAKE) {
            const intensity = Math.min((held - HOLD_BEFORE_SHAKE) / 1.5, 1);
            const amp = intensity * 0.07;
            shakeX = Math.sin(now * 0.024) * amp + Math.sin(now * 0.041) * amp * 0.35;
            shakeY = Math.cos(now * 0.028) * amp + Math.cos(now * 0.044) * amp * 0.35;
            wobbleRot = Math.sin(now * 0.032) * 0.02 * intensity;
          }
        }

        const renderX = THREE.MathUtils.clamp(state.pos.x + shakeX, -maxX, maxX);
        const renderY = THREE.MathUtils.clamp(state.pos.y + shakeY, -maxY, maxY);
        ballGroup.position.set(renderX, renderY, 0);

        // Hover cursor
        if (!state.dragging && !Number.isNaN(lastPointer.x)) {
          const dx = lastPointer.x - state.pos.x;
          const dy = lastPointer.y - state.pos.y;
          const over = dx * dx + dy * dy <= EFFECTIVE_RADIUS * EFFECTIVE_RADIUS;
          canvas.classList.toggle('grabbable', over);
        }

        // --- Disco visibility / crossfade ---
        // d was computed at the top of the tick (used for slow-mo too).
        if (d > 0) {
          discoBall.visible = true;
          discoCore.visible = true;
          matDisco.opacity = d;
          matDiscoCore.opacity = d;

          // Normal ball + outline are hidden during full disco, fade back in
          // during the fade window. Stays transparent only while we need it.
          const normalOpacity = 1 - d;
          ball.visible = normalOpacity > 0;
          outline.visible = normalOpacity > 0;
          matNormal.transparent = true;
          outlineMat.transparent = true;
          matNormal.opacity = normalOpacity;
          outlineMat.opacity = normalOpacity;

          // Background → midnight purple. Squared curve so the bg returns to
          // pure white slightly *ahead* of the disco intensity reaching zero —
          // eliminates the perceptible 1-frame color snap at the boundary.
          const bgT = d * d;
          bgCurrent.copy(bgNormal).lerp(bgDisco, bgT);
          renderer.setClearColor(bgCurrent, 1);

          // Sweeping spotlights: drift inside the viewport with Lissajous motion.
          // Cubed fade is much more aggressive than squared — by d=0.5 opacity
          // is already only 0.12, so they're effectively gone in the back half
          // of the fade, well before the bg has finished returning to white.
          // Range pulled INSIDE the viewport so a spotlight can't sit half-off
          // with only the bright gradient core peeking in.
          const xRange = Math.max(0.5, viewWidth / 2 - 1.5);
          const yRange = Math.max(0.5, viewHeight / 2 - 1.5);
          const spotFade = d * d * d;
          for (const sl of spotlights) {
            const u = sl.userData;
            sl.position.x = Math.cos(now * u.speedX + u.phase) * xRange;
            sl.position.y = Math.sin(now * u.speedY + u.phase * 1.3) * yRange;
            sl.material.opacity = spotFade * 0.55;
            sl.visible = true;
          }

        } else {
          // Idle — no transparent/opaque flag flipping; just opacity and
          // visibility. The flag stays true on matNormal/outlineMat permanently.
          if (discoBall.visible) discoBall.visible = false;
          if (discoCore.visible) discoCore.visible = false;
          if (!ball.visible) ball.visible = true;
          if (!outline.visible) outline.visible = true;
          if (matNormal.opacity !== 1) matNormal.opacity = 1;
          if (outlineMat.opacity !== 1) outlineMat.opacity = 1;
          if (!bgCurrent.equals(bgNormal)) {
            bgCurrent.copy(bgNormal);
            renderer.setClearColor(bgCurrent, 1);
          }
          for (const sl of spotlights) if (sl.visible) sl.visible = false;
        }

        // Spin — motion is slowed during disco but the ball itself SPINS FASTER,
        // like a real disco ball whirling above a dance floor.
        if (state.dragging) {
          if (wobbleRot) ballGroup.rotateOnWorldAxis(state.rotAxis, wobbleRot * dt * 60);
        } else {
          const speed = state.vel.length();
          const spin = Math.max(ROT_SPEED, (speed / SPEED) * ROT_SPEED);
          const spinBoost = 1 + d * 0.6; // up to ~1.6× at full disco
          ballGroup.rotateOnWorldAxis(state.rotAxis, spin * dt * spinBoost);
        }

        // Bloom is only on during FULL disco (d === 1). The moment the fade
        // starts, the pass is fully disabled (skipped in the composer chain)
        // so nothing about the bright-extraction step can leak a halo onto the
        // fading-in normal ball. We always run the composer either way — that
        // keeps the render path identical and avoids the path-switch flash.
        const bloomOn = d >= 1;
        bloomPass.enabled = bloomOn;
        bloomPass.strength = bloomOn ? 0.28 : 0;
        composer.render();
        requestAnimationFrame(tick);
      }
      requestAnimationFrame(tick);
    </script>
  </body>
</html>
